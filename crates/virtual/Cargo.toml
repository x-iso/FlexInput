[package]
name    = "flexinput-virtual"
version.workspace = true
edition.workspace = true

[dependencies]
flexinput-core = { workspace = true }
# The controller profiles, report encoder and feature answers: HIDMaestro's
# nodes on Windows, UHID devices on Linux.
flexinput-hidmaestro = { workspace = true }

[target.'cfg(windows)'.dependencies]
vigem-client = { version = "0.1", features = ["unstable_ds4", "unstable_xtarget_notification"] }
# 0.6 targets `windows` 0.61 — the same major accesskit/wasapi use. Keeping
# enigo (and midir) off `windows` 0.56 also lets gpu-allocator's range
# requirement resolve to 0.58, which the wgpu dx12 backend needs (see the
# wgpu comment in the workspace Cargo.toml).
enigo = "0.6"
# The composite USB personas (a virtual DualSense with its audio interfaces).
flexinput-usbip = { workspace = true }
# The display clock (display_clock.rs): vblank events, and the display under
# the foreground window. Already in the tree.
windows-sys = { version = "0.61", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# uinput / UHID: open, poll, ioctl. Already in the graph.
libc = "0.2"
# The composite USB personas, attached through the kernel's vhci-hcd.
flexinput-usbip = { workspace = true }

[dev-dependencies]
glam = { workspace = true }
