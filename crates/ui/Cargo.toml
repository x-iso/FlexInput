[package]
name    = "flexinput-ui"
version.workspace = true
edition.workspace = true
build   = "build.rs"

[dependencies]
flexinput-core    = { workspace = true }
flexinput-engine  = { workspace = true }
flexinput-devices = { workspace = true }
glam              = { workspace = true }
flexinput-virtual = { workspace = true }
flexinput-modules = { workspace = true }
egui              = { workspace = true }
egui_extras       = { workspace = true }
eframe            = { workspace = true }
# Direct SVG rasterization so we can recolor the pixmap before uploading as a
# texture — egui_extras' built-in SVG loader only supports multiplicative tint.
resvg             = "0.45"
usvg              = "0.45"
tiny-skia         = "0.11"
serde             = { workspace = true }
serde_json        = { workspace = true }
rfd               = { workspace = true }
egui-snarl        = { workspace = true, features = ["serde"] }
open              = "5"
# Lets us pull our own HWND out of `eframe::Frame` for direct Win32
# tweaks (window border tint, z-order drop on pin-off flip-flop,
# click-through layer when see-through + pin are both active).
raw-window-handle = "0.6"
# Profiler: macros + HTTP transport. The HTTP server is only spawned
# when the Settings → Profiler toggle is on; without that the puffin
# scope-start flag stays false and the macros are near-no-op (single
# atomic-bool load).
puffin             = { workspace = true }
puffin_http        = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Direct access to the HIDMaestro helper for the persistence setting + the
# reclaim-on-startup path (already a transitive dep via flexinput-virtual).
flexinput-hidmaestro = { workspace = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Media",
    "Win32_Graphics_Gdi",
] }
