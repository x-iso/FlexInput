[package]
name    = "flexinput-ui"
version.workspace = true
edition.workspace = true
build   = "build.rs"

[features]
# Audio Stream Haptics — optional module (Phase C pilot). On by default; forwards
# to the modules crate so the ASTH node is absent from the palette when off.
default = ["asth"]
asth = ["flexinput-modules/asth"]

[dependencies]
flexinput-core    = { workspace = true }
flexinput-engine  = { workspace = true }
flexinput-devices = { workspace = true }
glam              = { workspace = true }
flexinput-virtual = { workspace = true }
flexinput-modules = { workspace = true }
flexinput-net     = { workspace = true }
egui              = { workspace = true }
egui_extras       = { workspace = true }
eframe            = { workspace = true }
wgpu              = { workspace = true }
egui-wgpu         = { path = "../../vendor/egui-wgpu" }
# Blocks on wgpu's async adapter/buffer-map futures. Only the GPU capability
# tests need it, but wgpu re-exports no blocking helper of its own.
pollster          = "0.4"
bytemuck          = "1.24"
thiserror         = "2"
# Embeds app/assets/models into the binary at compile time (no hardcoded model
# names — whatever folders exist get bundled). On-disk assets still win in dev.
include_dir       = "0.7"
# Direct SVG rasterization so we can recolor the pixmap before uploading as a
# texture — egui_extras' built-in SVG loader only supports multiplicative tint.
resvg             = "0.45"
usvg              = "0.45"
tiny-skia         = "0.11"
serde             = { workspace = true }
serde_json        = { workspace = true }
rfd               = { workspace = true }
egui-snarl        = { workspace = true, features = ["serde"] }
open              = "5"
# Lets us pull our own HWND out of `eframe::Frame` for direct Win32
# tweaks (window border tint, z-order drop on pin-off flip-flop,
# click-through layer when see-through + pin are both active).
raw-window-handle = "0.6"
# Profiler: macros + HTTP transport. The HTTP server is only spawned
# when the Settings → Profiler toggle is on; without that the puffin
# scope-start flag stays false and the macros are near-no-op (single
# atomic-bool load).
puffin             = { workspace = true }
puffin_http        = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Direct access to the HIDMaestro helper for the persistence setting + the
# reclaim-on-startup path (already a transitive dep via flexinput-virtual).
flexinput-hidmaestro = { workspace = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
