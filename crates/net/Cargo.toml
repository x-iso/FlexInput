[package]
name    = "flexinput-net"
version.workspace = true
edition.workspace = true

[dependencies]
flexinput-core = { workspace = true }
glam           = { workspace = true }
rand             = "0.9"
chacha20poly1305 = "0.10"
hkdf             = "0.12"
sha2             = "0.10"

# P2P tier (feature-gated). iroh gives dial-by-EndpointId QUIC with NAT traversal
# (hole-punch) + relay fallback + DNS discovery, all over its own encrypted TLS
# (authenticated by the peer's public key). We carry the SAME protocol packets in
# its unreliable datagrams. tokio drives the async endpoints; bytes for datagram
# buffers. Pulls a large tree (~iroh + quinn + tokio), so it's opt-in.
iroh    = { version = "1", optional = true }
tokio   = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync"], optional = true }
bytes   = { version = "1", optional = true }

[features]
# P2P tier pulls iroh/quinn/tokio (a large transitive tree); off by default so
# the LAN + PSK tiers stay dependency-light. The app enables it via the engine.
default = []
p2p = ["dep:iroh", "dep:tokio", "dep:bytes"]
