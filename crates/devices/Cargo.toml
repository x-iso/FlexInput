[package]
name    = "flexinput-devices"
version.workspace = true
edition.workspace = true

[features]
# Joy-Con 2 over Bluetooth LE. On by default; forwarded from the app through
# the UI crate. Optional because it pulls btleplug + tokio, and a build that
# doesn't want the BLE stack shouldn't pay for compiling it.
default = ["joycon2"]
joycon2 = ["dep:flexinput-joycon2"]

[dependencies]
flexinput-core = { workspace = true }
# See crates/joycon2 — Switch 2 controllers speak a proprietary BLE GATT
# protocol with no HID-over-GATT service, so gilrs/SDL/hidapi can never see
# them and they need a backend of their own.
flexinput-joycon2 = { workspace = true, optional = true }
# Our own HCI stack, for Bluetooth Classic gamepads on a dedicated dongle.
flexinput-btle    = { path = "../btle" }
glam           = { workspace = true }
gilrs          = "0.10"
hidapi         = "2"
# SDL3 for gamepads FlexInput doesn't already parse natively (Steam Controller,
# third-party pads). gilrs + the raw-HID path keep the controllers they handle
# well (Xbox/DS4/DualSense/Switch Pro); SDL is enumerated ONLY for pads that
# `ControllerKind::detect` classifies as `Generic`, so no device surfaces twice.
# `build-from-source-static` compiles SDL from source and links it statically —
# no SDL3.dll to ship, matching how the project keeps `flexinput.exe` self-
# contained. `hidapi` lets SDL read gyro/touchpad over HID for those pads.
# Requires cmake + a C compiler at build time (VS-bundled cmake/ninja/cl —
# build from a VS Developer shell so they're on PATH).
sdl3           = { version = "0.20", features = ["build-from-source-static", "hidapi"] }
# 0.11 targets `windows` 0.62 — already present in the graph via iroh's
# netwatch, so no new parallel `windows` runtime (midir's WinRT MIDI stack ran
# on its own parallel major, 0.56, before too). Getting midir and enigo off
# 0.56 evicts that copy entirely, which keeps gpu-allocator bound to `windows`
# 0.58 as the dx12 backend requires (see workspace Cargo.toml).
midir          = "0.11"
# See engine/Cargo.toml — instrumentation is unconditional; emission is
# gated by the runtime puffin::set_scopes_on() flag.
puffin         = { workspace = true }
# FFT for the Audio Stream Haptics spectrum view + multi-band engine. Pure Rust,
# no system deps and no `windows` crate, so it can't reintroduce the COM-major
# conflict the wasapi pin guards against.
rustfft        = "6"

[target.'cfg(windows)'.dependencies]
# WASAPI access for DualSense HD haptics (channels 3/4 of the controller's
# 4-channel USB audio endpoint drive the left/right LRA actuators).
# The `wasapi` crate is a thin safe wrapper around the Windows COM interfaces;
# windows-sys would force us to hand-roll COM vtables, which is not worth it
# for a single audio render path.
#
# Pinned to 0.18: this is the last wasapi release that targets the `windows`
# crate at major 0.61 — the same major `accesskit_windows` 0.29 (pulled in by
# eframe 0.33) uses. Newer wasapi (0.20+) pulls in `windows 0.62`, which
# causes two parallel `windows` crate runtimes in the same process — both
# install COM apartment hooks, and the result is that accesskit's
# `SetPropW` calls in subclass.rs panic on startup with ERROR_NOT_ENOUGH_MEMORY.
wasapi = "=0.18"
# Recognises FlexInput's own composite USB personas by the USB serial
# flexinput-usbip gives them (devnode.rs), so they're never read back as pads.
flexinput-usbip = { workspace = true }
# Process enumeration for the Audio Stream Haptics module: list running
# processes (Toolhelp32 snapshot), resolve a chosen exe name → live PID, and
# read the foreground window's PID. Also CfgMgr32, so DualSense HD haptics
# open the audio endpoint in the pad's own device container. Bindings-only (no
# COM runtime), windows-sys 0.61 to match engine/ui — does NOT conflict with
# wasapi's `windows` major.
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same sdl3 as above; Cargo unions the features. SDL's CMake refuses to build on
# Linux without X11 or Wayland dev headers, but FlexInput only initialises the
# gamepad/joystick subsystems and never opens an SDL window, so the console
# build drops that requirement (and the X11/Wayland packages from the build box).
sdl3 = { version = "0.20", features = ["build-from-source-unix-console"] }
# The hide helper (linux_hide.rs): device nodes, xattrs, a netlink socket.
# Already in the tree.
libc = "0.2"
# DualSense HD haptics (dualsense_haptic.rs) on the pad's own sound card, the
# Linux side of the WASAPI path above. Already in the tree under midir, which
# links libasound.
alsa = "0.9"
