[package]
name    = "flexinput-engine"
version.workspace = true
edition.workspace = true

[dependencies]
flexinput-core = { workspace = true }
# Audio Stream Haptics: the proc thread reconciles per-node WASAPI loopback
# captures (devices::loopback_haptic) and eval reads their latest params. The
# manager API takes primitives (node uid + LoopbackTarget), so devices stays a
# leaf — no cycle. devices is a sibling leaf crate (core/glam/hid/wasapi only).
flexinput-devices = { workspace = true }
# Network Send/Receive: the proc thread reconciles per-node sockets (a leaf
# crate that only knows core + primitives, same shape as loopback_manager).
# `quic` pulls quinn/rustls/tokio so the shipped app offers all three transport
# tiers (LAN UDP / PSK UDP / QUIC) out of the box.
flexinput-net  = { workspace = true, features = ["quic"] }
uuid           = { workspace = true }
serde_json     = { workspace = true }
glam           = { workspace = true }
smallvec       = { workspace = true }
# Profiler hooks compile unconditionally but emit no events unless
# `puffin::set_scopes_on(true)` is called at runtime — flipping the
# Profiler toggle in Settings does that. The macro overhead when disabled
# is a single atomic-bool load per scope, so we leave the instrumentation
# permanently in place.
puffin         = { workspace = true }
arc-swap       = { workspace = true }

# Used only to raise the processing thread's scheduling priority on Windows so
# the 2 kHz engine tick is scheduled ahead of UI/render work (input latency).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
