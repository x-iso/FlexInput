[package]
name    = "flexinput"
version.workspace = true
edition.workspace = true
build   = "build.rs"
# `cargo run` at the workspace root resolves here (the GUI app). Without this it
# errors as ambiguous because the test-only `hidmaestro_helper` / `hm_shm_probe`
# bins also register as named binaries. The elevated HIDMaestro helper is NOT a
# separate run target — the app re-execs itself with `--hidmaestro-helper`.
default-run = "flexinput"

[dependencies]
flexinput-ui = { workspace = true }
eframe       = { workspace = true }
# Surface `log::warn!`/`log::error!` from wgpu/winit/egui on stderr. Without a
# logger those are silently dropped — which hid the swapchain errors behind
# the overlay-viewport "white ghost" bug. Filter default lives in main().
env_logger   = { version = "0.11", default-features = false, features = ["humantime"] }

# The bundled elevated helper: when launched with `--hidmaestro-helper` the app
# re-execs itself elevated and runs the HIDMaestro named-pipe server, so a
# single binary ships (no sibling helper exe).
[target.'cfg(windows)'.dependencies]
flexinput-hidmaestro = { workspace = true }
# Direct dep so wgpu's backend features (dx12/vulkan/metal) reach
# the final binary. Without this, wgpu compiles with zero backends
# and panics at runtime when eframe tries to create an Instance.
wgpu         = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
