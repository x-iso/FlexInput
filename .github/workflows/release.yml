name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # sdl3 (build-from-source-static) compiles SDL via CMake. windows-latest
      # ships CMake, but pin it explicitly so a future runner-image change can't
      # silently break the SDL build. Puts cmake on PATH; CMake's default MSVC
      # generator finds cl.exe/SDK on its own.
      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Build release binary
        run: cargo build --release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "FlexInput-$tag-windows-x64.zip"
          Compress-Archive -Path "target/release/flexinput.exe" -DestinationPath $archive
          echo "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: true
