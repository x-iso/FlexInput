[workspace]
members = [
    "crates/core",
    "crates/engine",
    "crates/devices",
    "crates/virtual",
    "crates/hidmaestro",
    "crates/net",
    "crates/modules",
    "crates/ui",
    "app",
]
# `cargo run` / `cargo build` at the workspace root default to the GUI app.
# Without this, the root sees binaries across all members (flexinput,
# hidmaestro_helper, hm_shm_probe) and `cargo run` errors as ambiguous. The
# elevated HIDMaestro helper is bundled into `flexinput` (self re-exec), not a
# separate run target.
default-members = ["app"]
resolver = "2"

[workspace.package]
version = "0.10.7"
edition = "2021"
license = "MIT"

[workspace.dependencies]
flexinput-core    = { path = "crates/core" }
flexinput-engine  = { path = "crates/engine" }
flexinput-devices = { path = "crates/devices" }
flexinput-virtual = { path = "crates/virtual" }
flexinput-hidmaestro = { path = "crates/hidmaestro" }
flexinput-net     = { path = "crates/net" }
flexinput-modules = { path = "crates/modules" }
flexinput-ui      = { path = "crates/ui" }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
glam       = { version = "0.27", features = ["serde"] }
uuid       = { version = "1", features = ["v4", "serde"] }
smallvec   = { version = "1", features = ["serde"] }
rfd        = "0.15"
egui       = "0.33"
# Default eframe features minus `accesskit`, with the renderer
# switched from `glow` (OpenGL) to `wgpu`. accesskit_windows
# crashes with `Result::unwrap on Err(ERROR_NOT_ENOUGH_MEMORY)`
# when Windows' global atom table is full — disabling the feature
# drops the screen-reader bridge but keeps everything else.
# wgpu lets the OS pick the best backend (D3D12 on Windows, Metal
# on macOS, Vulkan on Linux). The OpenGL path was failing to honor
# the transparent surface on at least one Windows/NVIDIA combo
# (RTX 4070) — wgpu's D3D12 path renders the alpha correctly and
# also unblocks first-class Linux/Vulkan support.
eframe     = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui-snarl = "0.9"
egui_extras = { version = "0.33", features = ["svg"] }
# eframe's `wgpu` feature only wires the egui-wgpu glue; the wgpu
# crate itself defaults to NO backends, which panics at runtime with
# "No wgpu backend feature that is implemented for the target
# platform was enabled". We add wgpu as a direct dep and explicitly
# enable Vulkan (works on Windows + Linux; NVIDIA/AMD/Intel all ship
# good drivers) and Metal (macOS). DX12 is intentionally omitted —
# wgpu-hal 27.0.4's dx12 backend has a windows-crate version conflict
# (gpu-allocator 0.27 pulls windows 0.56 but wgpu-hal targets 0.58).
# Vulkan is sufficient and gives us Linux parity without a second
# backend to maintain.
wgpu       = { version = "27", default-features = false, features = [
    "gles",
    "metal",
    "vulkan",
] }
# Lightweight CPU profiler. `puffin` macros compile to near-no-ops when
# the scope-start global flag is disabled (`puffin::set_scopes_on(false)`),
# so leaving the instrumentation permanently in place costs ~nothing.
# Profile data is streamed over TCP via `puffin_http` to the standalone
# `puffin_viewer` GUI — run `cargo install puffin_viewer`, then
# `puffin_viewer --url 127.0.0.1:8585` while FlexInput is running and the
# Settings toggle has profiling enabled. Picking the HTTP transport (vs
# `puffin_egui`) avoids coupling our egui 0.33 pin to the profiler crate's
# egui-version cadence.
puffin       = "0.20"
puffin_http  = "0.17"
# Atomically-swappable `Arc<T>`. Lets the UI publish a fresh
# ProcessingGraph snapshot to the proc thread, and the I/O thread publish
# a fresh device-signal map to the proc thread, with each consumer paying
# only a refcount bump per access instead of cloning the whole structure
# under a RwLock.
arc-swap     = "1"

[patch.crates-io]
egui-snarl = { path = "vendor/egui-snarl" }
# Vendored to fix the one unrecoverable GPU panic we hit: when a fullscreen
# game resets the graphics device, egui-wgpu's `update_buffers` panics because
# `queue.write_buffer_with` returns `None`. The vendored copy turns that panic
# into a skipped frame + a process-global `GPU_LOST` flag so the app can save
# state and relaunch cleanly instead of crashing. See `vendor/egui-wgpu/
# src/renderer.rs` (search "GPU_LOST") and `app/src/main.rs`.
egui-wgpu = { path = "vendor/egui-wgpu" }

# ── Debug-build performance ─────────────────────────────────────────────────
# The processing thread runs at 2 kHz (500 µs/tick budget) and the device-io
# thread at up to 4 kHz. At opt-level = 0 the engine's per-tick eval and the
# unoptimized egui/wgpu render path are slow enough that:
#   • eval_graph_tick blows the 500 µs budget and the catchup loop saturates
#     its `ticks.min(16)` cap, collapsing the effective processing rate, and
#   • heavy unoptimized render frames starve the equal-priority input threads.
# Both show up as input latency that only appears in debug.
#
# Fix: optimize our own crates lightly (opt-level = 1 — fast enough to hit the
# real-time budgets while keeping line-level debuggability) and optimize all
# dependencies fully (opt-level = 3 — egui/wgpu/glam/arc-swap are never the
# code you step through). This is the standard egui/game-loop dev profile and
# does not affect release behavior.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
